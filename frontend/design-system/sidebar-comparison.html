<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sidebar — Comparación de color</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #E8E8E8;
    font-family: Inter, sans-serif;
    min-height: 100vh;
    overflow-x: auto;
  }
</style>
</head>
<body>
<script type="text/babel">

const VARIANTS = [
  { label: '#141414', hex: '#141414', tag: 'Actual', tagColor: '#3D7A30', tagBg: '#D4EDD0' },
  { label: '#1E1E1E', hex: '#1E1E1E', tag: 'Sugerido', tagColor: '#2B4492', tagBg: '#D0DAEF' },
  { label: '#222222', hex: '#222222', tag: 'Opción', tagColor: '#2B4492', tagBg: '#D0DAEF' },
  { label: '#333333', hex: '#333333', tag: 'Límite', tagColor: '#C05A1A', tagBg: '#FDECD9' },
];

const NAV_ITEMS = [
  { id: 'dashboard', label: 'Dashboard' },
  { id: 'products',  label: 'Productos' },
  { id: 'orders',    label: 'Pedidos' },
  { id: 'inventory', label: 'Inventario' },
  { id: 'analytics', label: 'Analíticas' },
  { id: 'settings',  label: 'Ajustes' },
];

const MARKETS = ['🇨🇱 Chile', '🇵🇪 Perú', '🇨🇴 Colombia'];

const GREEN = '#5BA64A';
const RED   = '#D91F4D';
const BORDER_CONTENT = '#E8E8E8';

function SidebarPreview({ bg, activeItem = 'dashboard' }) {
  const sidebarBorder = 'rgba(255,255,255,0.08)';

  // Compute relative lightness to decide text/icon opacity
  const hexToLum = h => {
    const r = parseInt(h.slice(1,3),16)/255;
    const g = parseInt(h.slice(3,5),16)/255;
    const b = parseInt(h.slice(5,7),16)/255;
    return 0.2126*r + 0.7152*g + 0.0722*b;
  };
  const lum = hexToLum(bg);
  const sfg  = lum < 0.15 ? '#FFFFFF' : 'rgba(255,255,255,0.92)';
  const sfg2 = lum < 0.15 ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.70)';
  const sfg3 = lum < 0.15 ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.40)';

  return (
    <div style={{
      width: 200, height: 520,
      background: bg,
      borderRadius: 10,
      display: 'flex', flexDirection: 'column',
      overflow: 'hidden',
      border: `1px solid ${sidebarBorder}`,
    }}>
      {/* Logo */}
      <div style={{ padding: '18px 16px 16px', borderBottom: `1px solid ${sidebarBorder}` }}>
        <img src="assets/logo.png" alt="Seller Center"
          style={{ width: '100%', objectFit: 'contain', height: 24, filter: 'invert(1) brightness(1.8)' }} />
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: '8px 8px' }}>
        {NAV_ITEMS.map(item => {
          const isActive = activeItem === item.id;
          return (
            <div key={item.id} style={{
              display: 'flex', alignItems: 'center', width: '100%',
              padding: '9px 12px', borderRadius: 7,
              background: isActive ? 'rgba(91,166,74,0.15)' : 'transparent',
              color: isActive ? GREEN : sfg2,
              fontFamily: 'Inter, sans-serif', fontSize: 13,
              fontWeight: isActive ? 600 : 400,
              marginBottom: 2,
              borderLeft: isActive ? `2px solid ${GREEN}` : '2px solid transparent',
            }}>
              {item.label}
            </div>
          );
        })}
      </nav>

      {/* Market */}
      <div style={{ padding: '12px 14px', borderTop: `1px solid ${sidebarBorder}` }}>
        <div style={{ fontSize: 9, color: sfg3, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 5, fontFamily: 'Inter, sans-serif' }}>Mercado</div>
        <div style={{
          width: '100%', background: 'rgba(255,255,255,0.07)',
          border: `1px solid ${sidebarBorder}`, borderRadius: 7,
          color: sfg, padding: '7px 10px', fontSize: 12,
          fontFamily: 'Inter, sans-serif',
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        }}>
          🇨🇱 Chile <span style={{ color: sfg3, fontSize: 10 }}>▾</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{
      minHeight: '100vh',
      padding: '48px 40px',
      display: 'flex',
      flexDirection: 'column',
      gap: 48,
      alignItems: 'center',
    }}>

      {/* Header */}
      <div style={{ textAlign: 'center' }}>
        <div style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 800, fontSize: 22, color: '#1A1A1A', letterSpacing: '-0.03em' }}>
          Sidebar — Comparación de color
        </div>
        <div style={{ fontFamily: 'Inter, sans-serif', fontSize: 13, color: '#888', marginTop: 6 }}>
          4 variantes oscuras · fondo content siempre <code style={{ background: '#fff', padding: '1px 6px', borderRadius: 4, border: '1px solid #ddd' }}>#F5F5F5</code>
        </div>
      </div>

      {/* Grid */}
      <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap', justifyContent: 'center' }}>
        {VARIANTS.map(v => (
          <div key={v.hex} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>

            {/* Tag */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{
                fontFamily: 'Inter, sans-serif', fontSize: 11, fontWeight: 700,
                letterSpacing: '0.06em', textTransform: 'uppercase',
                color: v.tagColor, background: v.tagBg,
                padding: '3px 10px', borderRadius: 99,
              }}>{v.tag}</span>
            </div>

            {/* Sidebar + Content strip side by side */}
            <div style={{ display: 'flex', borderRadius: 10, overflow: 'hidden', boxShadow: '0 8px 32px rgba(0,0,0,0.18)', border: '1px solid rgba(0,0,0,0.10)' }}>
              <SidebarPreview bg={v.hex} />

              {/* Content area strip */}
              <div style={{
                width: 160, height: 520, background: '#F5F5F5',
                padding: '14px', display: 'flex', flexDirection: 'column', gap: 10,
              }}>
                {/* Topbar */}
                <div style={{
                  background: '#fff', borderRadius: 7, padding: '8px 12px',
                  border: `1px solid ${BORDER_CONTENT}`,
                  fontFamily: 'Montserrat, sans-serif', fontWeight: 800, fontSize: 13,
                  color: '#1A1A1A', letterSpacing: '-0.02em',
                }}>Dashboard</div>

                {/* KPI cards */}
                {[
                  { label: 'Ventas', val: '$1.2M', delta: '↑ 8.2%', up: true },
                  { label: 'Pedidos', val: '3,842', delta: '↑ 4.1%', up: true },
                  { label: 'Devoluciones', val: '124', delta: '↓ 2.3%', up: false },
                ].map(k => (
                  <div key={k.label} style={{
                    background: '#fff', borderRadius: 7, padding: '10px 12px',
                    border: `1px solid ${BORDER_CONTENT}`,
                  }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 9, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.07em', color: '#9E9E9E', marginBottom: 4 }}>{k.label}</div>
                    <div style={{ fontFamily: 'Montserrat', fontSize: 18, fontWeight: 800, color: '#1A1A1A', letterSpacing: '-0.03em' }}>{k.val}</div>
                    <div style={{ fontFamily: 'Inter', fontSize: 10, fontWeight: 600, color: k.up ? GREEN : RED, marginTop: 3 }}>{k.delta}</div>
                  </div>
                ))}

                {/* Chart placeholder */}
                <div style={{
                  background: '#fff', borderRadius: 7, flex: 1,
                  border: `1px solid ${BORDER_CONTENT}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexDirection: 'column', gap: 4,
                }}>
                  <div style={{ width: '70%', height: 3, background: '#E8E8E8', borderRadius: 2 }} />
                  <div style={{ width: '55%', height: 3, background: '#E8E8E8', borderRadius: 2 }} />
                  <div style={{ width: '65%', height: 3, background: '#E8E8E8', borderRadius: 2 }} />
                  <div style={{ fontFamily: 'Inter', fontSize: 9, color: '#BDBDBD', marginTop: 4 }}>Gráfico ventas</div>
                </div>
              </div>
            </div>

            {/* Hex label + contrast info */}
            <div style={{ textAlign: 'center' }}>
              <div style={{
                fontFamily: 'JetBrains Mono, monospace', fontSize: 15, fontWeight: 700,
                color: '#1A1A1A', letterSpacing: '0.04em',
                display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'center',
              }}>
                <div style={{ width: 14, height: 14, borderRadius: 3, background: v.hex, border: '1.5px solid rgba(0,0,0,0.15)' }} />
                {v.hex}
              </div>
              <ContrastBadge bg={v.hex} />
            </div>
          </div>
        ))}
      </div>

      {/* Legend / verdict */}
      <div style={{
        maxWidth: 720, width: '100%',
        background: '#fff', borderRadius: 12, padding: '20px 28px',
        border: '1px solid #E8E8E8', boxShadow: '0 2px 8px rgba(0,0,0,0.06)',
      }}>
        <div style={{ fontFamily: 'Montserrat', fontWeight: 700, fontSize: 14, color: '#1A1A1A', marginBottom: 14 }}>Análisis</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {[
            { hex: '#141414', dot: '#D4EDD0', dotText: '#3D7A30', tag: 'Actual', note: 'Máximo contraste. El verde del nav item activo resalta con mayor fuerza. Ideal para uso intensivo.' },
            { hex: '#1E1E1E', dot: '#D0DAEF', dotText: '#2B4492', tag: 'Sugerido', note: 'Diferencia casi imperceptible pero más "suave". El punto dulce si quieres aflojar sin perder nada.' },
            { hex: '#222222', dot: '#D0DAEF', dotText: '#2B4492', tag: 'Opción', note: 'Funciona bien. Comienzas a notar la diferencia vs el negro puro. Aún buen contraste.' },
            { hex: '#333333', dot: '#FDECD9', dotText: '#C05A1A', tag: 'Límite', note: 'El color más claro que puedes usar. El logo invertido empieza a perder fuerza. Límite aceptable.' },
          ].map(r => (
            <div key={r.hex} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0, width: 120 }}>
                <div style={{ width: 10, height: 10, borderRadius: 2, background: r.hex, border: '1px solid rgba(0,0,0,0.2)', flexShrink: 0 }} />
                <span style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: '#444' }}>{r.hex}</span>
              </div>
              <span style={{
                fontFamily: 'Inter', fontSize: 10, fontWeight: 700, letterSpacing: '0.06em',
                textTransform: 'uppercase', color: r.dotText, background: r.dot,
                padding: '2px 8px', borderRadius: 99, flexShrink: 0, alignSelf: 'flex-start',
              }}>{r.tag}</span>
              <span style={{ fontFamily: 'Inter', fontSize: 12, color: '#5C5C5C', lineHeight: 1.5 }}>{r.note}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ContrastBadge({ bg }) {
  // WCAG contrast ratio approximation against white text
  const hexToRel = h => {
    const toLinear = c => { const s = c/255; return s <= 0.04045 ? s/12.92 : Math.pow((s+0.055)/1.055, 2.4); };
    const r = toLinear(parseInt(h.slice(1,3),16));
    const g = toLinear(parseInt(h.slice(3,5),16));
    const b = toLinear(parseInt(h.slice(5,7),16));
    return 0.2126*r + 0.7152*g + 0.0722*b;
  };
  const L1 = hexToRel(bg);
  const L2 = 1; // white
  const ratio = (L2 + 0.05) / (L1 + 0.05);
  const pass = ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : ratio >= 3 ? 'AA Large' : 'Fail';
  const passColor = pass === 'AAA' ? '#3D7A30' : pass === 'AA' ? '#2B4492' : pass === 'AA Large' ? '#C05A1A' : '#A81839';
  const passBg = pass === 'AAA' ? '#D4EDD0' : pass === 'AA' ? '#D0DAEF' : pass === 'AA Large' ? '#FDECD9' : '#FAD0DC';

  return (
    <div style={{ marginTop: 4, display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'center' }}>
      <span style={{ fontFamily: 'Inter', fontSize: 10, color: '#9E9E9E' }}>vs texto blanco</span>
      <span style={{
        fontFamily: 'Inter', fontSize: 10, fontWeight: 700,
        color: passColor, background: passBg,
        padding: '2px 7px', borderRadius: 99,
      }}>{pass} · {ratio.toFixed(1)}:1</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
