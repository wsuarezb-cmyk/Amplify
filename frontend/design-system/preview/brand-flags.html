<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: #fff; padding: 20px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9E9E9E; margin-bottom: 12px; }
.flags { display: flex; gap: 14px; align-items: center; }
.flag-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.flag-item img { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E0E0E0; object-fit: cover; }
.flag-item span { font-size: 10px; color: #5C5C5C; font-weight: 500; }
</style></head>
<body>
<div class="title">LATAM Markets</div>
<div class="flags">
  <div class="flag-item"><img src="../assets/images/image166.png"><span>México</span></div>
  <div class="flag-item"><img src="../assets/images/image167.png"><span>Perú</span></div>
  <div class="flag-item"><img src="../assets/images/image168.png"><span>Chile</span></div>
  <div class="flag-item"><img src="../assets/images/image169.png"><span>Colombia</span></div>
  <div class="flag-item"><img src="../assets/images/image170.png"><span>Argentina</span></div>
</div>
</body></html>
