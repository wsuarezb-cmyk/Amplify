<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: #fff; padding: 20px; }
.swatches { display: flex; gap: 12px; }
.swatch { flex: 1; }
.color { height: 72px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.06); }
.name { font-size: 12px; font-weight: 600; color: #1a1a1a; }
.hex  { font-size: 11px; color: #757575; font-family: 'JetBrains Mono', monospace; }
.title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9E9E9E; margin-bottom: 12px; }
</style></head>
<body>
<div class="title">Brand Colors</div>
<div class="swatches">
  <div class="swatch"><div class="color" style="background:#5BA64A"></div><div class="name">Green</div><div class="hex">#5BA64A</div></div>
  <div class="swatch"><div class="color" style="background:#3B5BA5"></div><div class="name">Blue</div><div class="hex">#3B5BA5</div></div>
  <div class="swatch"><div class="color" style="background:#D91F4D"></div><div class="name">Red</div><div class="hex">#D91F4D</div></div>
  <div class="swatch"><div class="color" style="background:#9E9E9E"></div><div class="name">Gray</div><div class="hex">#9E9E9E</div></div>
</div>
</body></html>
