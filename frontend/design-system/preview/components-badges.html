<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #fff; padding: 20px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9E9E9E; margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.success { background: #D4EDD0; color: #3D7A30; }
.danger  { background: #FAD0DC; color: #A81839; }
.warning { background: #FDECD9; color: #C05A1A; }
.info    { background: #D0DAEF; color: #2B4492; }
.neutral { background: #EEEEEE; color: #5C5C5C; }
.tag { background: #F5F5F5; color: #3F3F3F; border: 1px solid #E0E0E0; border-radius: 4px; padding: 3px 8px; font-size: 12px; }
</style></head>
<body>
<div class="title">Status Badges</div>
<div class="row">
  <span class="badge success"><span class="badge-dot"></span>Activo</span>
  <span class="badge danger"><span class="badge-dot"></span>Inactivo</span>
  <span class="badge warning"><span class="badge-dot"></span>Pendiente</span>
  <span class="badge info"><span class="badge-dot"></span>En revisión</span>
  <span class="badge neutral"><span class="badge-dot"></span>Borrador</span>
</div>
<div class="title" style="margin-top:8px">Tags</div>
<div class="row">
  <span class="tag">Chile</span>
  <span class="tag">Colombia</span>
  <span class="tag">Perú</span>
  <span class="tag">México</span>
  <span class="tag">Argentina</span>
</div>
</body></html>
