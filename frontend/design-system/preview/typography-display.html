<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<div class="row"><div class="meta">48px / 800</div><div style="font-family:'Montserrat',sans-serif;font-size:48px;font-weight:800;letter-spacing:-0.04em;color:#fff;line-height:1">Dashboard</div></div>
<div class="row"><div class="meta">36px / 700</div><div style="font-family:'Montserrat',sans-serif;font-size:36px;font-weight:700;letter-spacing:-0.03em;color:#fff">Gestiona tus ventas</div></div>
<div class="row"><div class="meta">24px / 700</div><div style="font-family:'Montserrat',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em;color:#fff">Publicar producto nuevo</div></div>
<div class="row"><div class="meta">18px / 800</div><div style="font-family:'Montserrat',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.02em;color:#5BA64A">Panel de control del vendedor</div></div>
