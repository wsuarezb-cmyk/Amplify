<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: #fff; padding: 20px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9E9E9E; margin-bottom: 10px; }
.row { display: flex; gap: 4px; }
.step { flex: 1; height: 48px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.07); position: relative; }
.step span { position: absolute; bottom: -16px; left: 0; font-size: 9px; color: #9E9E9E; font-family: monospace; }
</style></head>
<body>
<div class="title">Neutral Scale</div>
<div class="row">
  <div class="step" style="background:#1A1A1A"><span>Black</span></div>
  <div class="step" style="background:#2D2D2D"><span>900</span></div>
  <div class="step" style="background:#3F3F3F"><span>800</span></div>
  <div class="step" style="background:#5C5C5C"><span>700</span></div>
  <div class="step" style="background:#757575"><span>600</span></div>
  <div class="step" style="background:#9E9E9E"><span>500</span></div>
  <div class="step" style="background:#BDBDBD"><span>400</span></div>
  <div class="step" style="background:#E0E0E0"><span>300</span></div>
  <div class="step" style="background:#EEEEEE"><span>200</span></div>
  <div class="step" style="background:#F5F5F5"><span>100</span></div>
  <div class="step" style="background:#FFFFFF"><span>White</span></div>
</div>
</body></html>
