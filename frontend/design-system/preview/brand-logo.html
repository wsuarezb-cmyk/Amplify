<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: #fff; padding: 20px; display: flex; gap: 20px; align-items: stretch; }
.bg { border-radius: 8px; padding: 20px 28px; display: flex; align-items: center; justify-content: center; flex: 1; border: 1px solid #E0E0E0; }
img { max-width: 100%; height: auto; max-height: 60px; object-fit: contain; }
</style></head>
<body>
  <div class="bg" style="background:#fff"><img src="../assets/logo.png" alt="Seller Center Falabella logo"></div>
  <div class="bg" style="background:#F5F5F5"><img src="../assets/logo.png" alt="Seller Center Falabella logo on gray"></div>
  <div class="bg" style="background:#1A1A1A"><img src="../assets/logo.png" alt="Seller Center Falabella logo on dark" style="filter:invert(1)"></div>
</body></html>
