<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-body); background: #fff; padding: 20px; }
.title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #9E9E9E; margin-bottom: 12px; }
.grid { display: flex; flex-wrap: wrap; gap: 10px; }
.icon-item { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
.icon-item img { width: 40px; height: 40px; object-fit: contain; }
.icon-item span { font-size: 9px; color: #9E9E9E; text-align: center; line-height: 1.2; }
</style></head>
<body>
<div class="title">Fluent Icons (sample)</div>
<div class="grid">

  <div class="icon-item"><img src="../assets/icons/image34.svg"><span>Globe</span></div>

  <div class="icon-item"><img src="../assets/icons/image37.svg"><span>Heart</span></div>
  <div class="icon-item"><img src="../assets/icons/image38.svg"><span>House</span></div>
  <div class="icon-item"><img src="../assets/icons/image43.svg"><span>Lock</span></div>
  <div class="icon-item"><img src="../assets/icons/image44.svg"><span>Search</span></div>
  <div class="icon-item"><img src="../assets/icons/image48.svg"><span>Rocket</span></div>

  <div class="icon-item"><img src="../assets/icons/image58.svg"><span>Box</span></div>
  <div class="icon-item"><img src="../assets/icons/image61.svg"><span>Briefcase</span></div>

</body></html>
